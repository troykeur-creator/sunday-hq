<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Sunday HQ — NFL Scores, Standings & Scouting</title>
<meta name="theme-color" id="metaTheme" content="#0A100D">
<meta property="og:title" content="Sunday HQ">
<meta property="og:description" content="Live NFL scores, standings, and AI scouting — pick your team.">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🏈</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Saira+Condensed:wght@500;600;700&family=Public+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://unpkg.com/react@18.3.1/umd/react.production.min.js" crossorigin></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.production.min.js" crossorigin></script>
<style>
/* ============ TOKENS ============ */
:root{
  --field:#0A100D;          /* midnight turf */
  --turf:#121A15;           /* card surface */
  --turf2:#18231C;          /* raised surface */
  --line:rgba(242,244,239,.08);
  --chalk:#F2F4EF;
  --chalk-dim:#9AA69E;
  --chalk-faint:#5E6B62;
  --live:#FF4D4D;
  --win:#4CC38A;
  --team:#0076B6;           /* overwritten by team theme */
  --team-glow:#3AA7E0;
  --team2:#B0B7BC;
  --r:16px; --r-sm:10px;
  --nav-h:66px;
  --display:'Saira Condensed',system-ui,sans-serif;
  --body:'Public Sans',system-ui,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html{scroll-behavior:smooth}
body{
  background:var(--field);color:var(--chalk);font-family:var(--body);
  font-size:15px;line-height:1.45;overscroll-behavior-y:none;
  padding-bottom:calc(var(--nav-h) + env(safe-area-inset-bottom));
}
button{font-family:inherit;color:inherit;background:none;border:none;cursor:pointer}
img{display:block}
::selection{background:var(--team);color:#fff}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;transition-duration:.01ms!important}}

/* ============ TYPE ============ */
.eyebrow{
  font-family:var(--display);font-weight:600;font-size:12px;letter-spacing:.14em;
  text-transform:uppercase;color:var(--chalk-dim);display:flex;align-items:center;gap:8px;
}
.eyebrow::before{content:'';width:14px;height:8px;border-left:2px solid var(--team-glow);border-right:2px solid var(--team-glow);opacity:.9}
.display{font-family:var(--display);font-weight:700;letter-spacing:.01em}
.num{font-family:var(--display);font-weight:700;font-variant-numeric:tabular-nums}

/* ============ APP FRAME ============ */
.wrap{max-width:560px;margin:0 auto;padding:0 14px}
.screen{animation:fadeUp .25s ease both}
@keyframes fadeUp{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}

/* ============ HERO ============ */
.hero{
  position:relative;overflow:hidden;border-radius:0 0 24px 24px;
  background:
    repeating-linear-gradient(90deg,transparent 0 9.8%,rgba(242,244,239,.05) 9.8% 10%),
    linear-gradient(160deg,color-mix(in srgb,var(--team) 38%,var(--field)) 0%,var(--field) 78%);
  padding:calc(14px + env(safe-area-inset-top)) 16px 18px;
}
.hero-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}
.brand{font-family:var(--display);font-weight:700;font-size:20px;letter-spacing:.04em;display:flex;align-items:center;gap:8px}
.brand small{font-weight:500;font-size:11px;letter-spacing:.18em;color:var(--chalk-dim)}
.icon-btn{width:38px;height:38px;border-radius:12px;background:rgba(242,244,239,.08);display:grid;place-items:center;transition:background .15s}
.icon-btn:active{background:rgba(242,244,239,.16)}
.hero-mini{
  position:sticky;top:0;z-index:40;height:56px;
  display:flex;align-items:center;gap:10px;padding:0 16px;
  padding-top:env(safe-area-inset-top);height:calc(56px + env(safe-area-inset-top));
  background:color-mix(in srgb,var(--field) 82%,transparent);
  backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
  border-bottom:1px solid var(--line);
}
.hero-mini img{width:26px;height:26px}
.hero-mini .t{font-family:var(--display);font-weight:700;font-size:17px;letter-spacing:.03em;flex:1}

/* ============ NEXT GAME CARD ============ */
.next-card{
  background:rgba(10,16,13,.55);border:1px solid var(--line);border-radius:var(--r);
  padding:14px;backdrop-filter:blur(6px);
}
.next-vs{display:flex;align-items:center;justify-content:space-between;gap:8px;margin:10px 0 6px}
.next-team{display:flex;flex-direction:column;align-items:center;gap:6px;flex:1}
.next-team img{width:52px;height:52px;filter:drop-shadow(0 4px 10px rgba(0,0,0,.5))}
.next-team .ab{font-family:var(--display);font-weight:700;font-size:18px}
.next-team .rec{font-size:11px;color:var(--chalk-dim)}
.next-mid{display:flex;flex-direction:column;align-items:center;gap:4px;min-width:86px}
.next-mid .at{font-size:11px;letter-spacing:.2em;color:var(--chalk-faint)}
.countdown{display:flex;gap:8px}
.cd-cell{text-align:center}
.cd-cell .num{font-size:24px;line-height:1}
.cd-cell span{font-size:9px;letter-spacing:.12em;color:var(--chalk-dim);text-transform:uppercase}
.next-meta{display:flex;justify-content:center;gap:10px;font-size:12px;color:var(--chalk-dim);flex-wrap:wrap}
.tap-hint{margin-top:10px;text-align:center;font-size:11px;color:var(--chalk-faint);letter-spacing:.06em}

/* ============ CHIP RAIL ============ */
.rail{
  display:flex;gap:8px;overflow-x:auto;padding:12px 14px;scrollbar-width:none;
  -webkit-overflow-scrolling:touch;scroll-padding:0 40px;
}
.rail::-webkit-scrollbar{display:none}
.chip{
  flex:0 0 auto;padding:7px 14px;border-radius:999px;border:1px solid var(--line);
  background:var(--turf);font-family:var(--display);font-weight:600;font-size:14px;
  letter-spacing:.05em;color:var(--chalk-dim);transition:all .15s;
}
.chip.on{background:var(--team);border-color:var(--team);color:var(--team-ink,#fff);box-shadow:0 2px 14px color-mix(in srgb,var(--team) 45%,transparent)}
.chip.post{border-style:dashed}

/* ============ GAME CARDS ============ */
.card{
  background:var(--turf);border:1px solid var(--line);border-radius:var(--r);
  padding:12px 14px;margin-bottom:10px;transition:transform .12s,background .15s;
}
.card:active{transform:scale(.985);background:var(--turf2)}
.card.fav{border-color:color-mix(in srgb,var(--team-glow) 50%,var(--line))}
.g-row{display:flex;align-items:center;gap:10px;padding:5px 0}
.g-row img{width:30px;height:30px}
.g-row .ab{font-family:var(--display);font-weight:700;font-size:17px;width:46px}
.g-row .rec{font-size:11px;color:var(--chalk-faint);flex:1}
.g-row .sc{font-size:24px;min-width:38px;text-align:right}
.g-row.loser{opacity:.55}
.poss{width:8px;height:8px;border-radius:50%;background:var(--team-glow);box-shadow:0 0 8px var(--team-glow)}
.g-status{display:flex;align-items:center;justify-content:space-between;border-top:1px solid var(--line);margin-top:8px;padding-top:8px;font-size:12px;color:var(--chalk-dim)}
.live-dot{display:inline-flex;align-items:center;gap:6px;color:var(--live);font-weight:700;font-size:12px;letter-spacing:.08em}
.live-dot::before{content:'';width:7px;height:7px;border-radius:50%;background:var(--live);animation:pulse 1.4s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.35}}
.dd{font-size:12px;color:var(--chalk)}
.final-tag{font-family:var(--display);font-weight:700;letter-spacing:.1em;font-size:13px}

/* ============ FIELD PROB BAR (signature) ============ */
.fieldbar{margin:14px 0}
.fieldbar-track{
  position:relative;height:34px;border-radius:8px;overflow:hidden;
  background:
    repeating-linear-gradient(90deg,transparent 0 calc(10% - 1px),rgba(242,244,239,.14) calc(10% - 1px) 10%),
    #14201A;
  border:1px solid var(--line);
}
.fieldbar-fill{position:absolute;inset:0 auto 0 0;transition:width .6s cubic-bezier(.2,.8,.2,1)}
.fieldbar-mark{position:absolute;top:-3px;bottom:-3px;width:3px;background:var(--chalk);border-radius:2px;transition:left .6s cubic-bezier(.2,.8,.2,1);box-shadow:0 0 6px rgba(0,0,0,.6)}
.fieldbar-row{display:flex;justify-content:space-between;align-items:center;margin-top:6px;font-size:12px}
.fieldbar-row img{width:20px;height:20px;display:inline-block;vertical-align:-5px;margin-right:5px}
.fieldbar-row b{font-family:var(--display);font-size:15px}

/* ============ SECTIONS / LISTS ============ */
.section{padding:16px 0 4px}
.section .eyebrow{margin-bottom:10px}
.leader{display:flex;align-items:center;gap:10px;padding:7px 0;border-bottom:1px solid var(--line);font-size:13px}
.leader:last-child{border-bottom:none}
.leader .cat{width:44px;color:var(--chalk-faint);font-size:11px;text-transform:uppercase;letter-spacing:.08em}
.leader .who{flex:1;font-weight:600}
.leader .val{color:var(--chalk-dim)}
.playline{padding:8px 10px;border-left:3px solid var(--team);background:var(--turf2);border-radius:0 10px 10px 0;font-size:13px;color:var(--chalk-dim);margin:8px 0}

/* ============ STANDINGS ============ */
.div-table{background:var(--turf);border:1px solid var(--line);border-radius:var(--r);margin-bottom:14px;overflow:hidden}
.div-table h3{font-family:var(--display);font-weight:700;font-size:15px;letter-spacing:.06em;padding:10px 14px;border-bottom:1px solid var(--line);color:var(--chalk-dim)}
.st-row{display:flex;align-items:center;gap:10px;padding:9px 14px;border-bottom:1px solid var(--line)}
.st-row:last-child{border-bottom:none}
.st-row img{width:24px;height:24px}
.st-row .ab{font-family:var(--display);font-weight:700;font-size:15px;flex:1}
.st-row .wl{min-width:52px;text-align:right;font-size:15px}
.st-row .pct{min-width:44px;text-align:right;color:var(--chalk-dim);font-size:12px}
.st-row.fav{background:color-mix(in srgb,var(--team) 14%,transparent)}

/* ============ SHEET ============ */
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:80;animation:fade .2s both}
@keyframes fade{from{opacity:0}}
.sheet{
  position:fixed;left:0;right:0;bottom:0;z-index:90;max-width:560px;margin:0 auto;
  background:var(--turf);border-radius:22px 22px 0 0;border:1px solid var(--line);border-bottom:none;
  max-height:88vh;display:flex;flex-direction:column;
  animation:slideUp .28s cubic-bezier(.2,.8,.2,1) both;touch-action:none;
}
@keyframes slideUp{from{transform:translateY(100%)}}
.sheet-grab{padding:10px 0 6px;display:grid;place-items:center;cursor:grab;flex:0 0 auto}
.sheet-grab::before{content:'';width:40px;height:4px;border-radius:2px;background:var(--chalk-faint)}
.sheet-body{overflow-y:auto;padding:0 16px 28px;touch-action:pan-y;-webkit-overflow-scrolling:touch}
.sheet-head{display:flex;align-items:center;gap:12px;padding-bottom:12px;border-bottom:1px solid var(--line)}
.sheet-head img{width:44px;height:44px}
.sheet-head .t{font-family:var(--display);font-weight:700;font-size:20px;line-height:1.1}
.sheet-head .s{font-size:12px;color:var(--chalk-dim)}
.sheet-score{font-family:var(--display);font-weight:700;font-size:30px;margin-left:auto;font-variant-numeric:tabular-nums;text-align:right;line-height:1.15}

/* ============ AI / HYPE ============ */
.ai-btn{
  width:100%;padding:13px;border-radius:14px;font-family:var(--display);font-weight:700;
  font-size:16px;letter-spacing:.06em;background:var(--team);color:var(--team-ink,#fff);
  box-shadow:0 4px 18px color-mix(in srgb,var(--team) 40%,transparent);transition:transform .12s;
}
.ai-btn:active{transform:scale(.97)}
.ai-btn:disabled{opacity:.5;box-shadow:none}
.ai-out{white-space:pre-wrap;font-size:14px;line-height:1.6;background:var(--turf2);border:1px solid var(--line);border-radius:14px;padding:14px;margin-top:12px}
.hype-card{
  border-radius:18px;padding:20px 18px;margin-top:12px;position:relative;overflow:hidden;
  background:linear-gradient(150deg,var(--team) 0%,color-mix(in srgb,var(--team) 30%,#000) 100%);
  color:var(--team-ink,#fff);box-shadow:0 8px 30px color-mix(in srgb,var(--team) 35%,transparent);
}
.hype-card::after{content:'';position:absolute;inset:0;background:repeating-linear-gradient(90deg,transparent 0 19%,rgba(255,255,255,.06) 19% 20%)}
.hype-card img{width:44px;height:44px;margin-bottom:10px;position:relative;z-index:1}
.hype-card p{position:relative;z-index:1;font-size:15px;line-height:1.55;font-weight:500}
.hype-card .cry{font-family:var(--display);font-weight:700;font-size:19px;margin-top:10px;letter-spacing:.04em}

/* ============ ONBOARDING ============ */
.firstrun{position:fixed;inset:0;z-index:100;background:var(--field);overflow-y:auto;padding:calc(24px + env(safe-area-inset-top)) 18px 40px}
.firstrun h1{font-family:var(--display);font-weight:700;font-size:34px;line-height:1.05;margin:8px 0 4px}
.firstrun .sub{color:var(--chalk-dim);margin-bottom:20px}
.divgrid h4{font-family:var(--display);font-weight:600;font-size:13px;letter-spacing:.12em;text-transform:uppercase;color:var(--chalk-faint);margin:18px 0 8px}
.teamgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.team-pick{background:var(--turf);border:1px solid var(--line);border-radius:14px;padding:10px 4px;display:flex;flex-direction:column;align-items:center;gap:6px;transition:all .15s}
.team-pick img{width:36px;height:36px}
.team-pick span{font-family:var(--display);font-weight:700;font-size:13px}
.team-pick:active{transform:scale(.94)}
.team-pick.on{border-color:var(--team-glow);background:color-mix(in srgb,var(--team) 20%,var(--turf))}

/* ============ SETTINGS ============ */
.set-row{padding:14px 0;border-bottom:1px solid var(--line)}
.set-row label{display:block;font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--chalk-dim);margin-bottom:6px}
.set-row input{width:100%;background:var(--turf2);border:1px solid var(--line);border-radius:10px;padding:11px 12px;color:var(--chalk);font-size:14px;font-family:var(--body)}
.set-row input:focus{outline:2px solid var(--team-glow);outline-offset:-1px}
.set-note{font-size:12px;color:var(--chalk-faint);margin-top:6px;line-height:1.5}
.set-btn{margin-top:8px;padding:10px 16px;border-radius:10px;background:var(--turf2);border:1px solid var(--line);font-weight:600;font-size:13px}

/* ============ NAV ============ */
.nav{
  position:fixed;left:0;right:0;bottom:0;z-index:70;max-width:560px;margin:0 auto;
  height:calc(var(--nav-h) + env(safe-area-inset-bottom));padding-bottom:env(safe-area-inset-bottom);
  display:flex;background:color-mix(in srgb,var(--field) 80%,transparent);
  backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border-top:1px solid var(--line);
}
.nav button{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;color:var(--chalk-faint);font-size:10px;letter-spacing:.06em;font-weight:600;position:relative}
.nav button.on{color:var(--chalk)}
.nav button.on::before{content:'';position:absolute;top:0;width:38px;height:3px;border-radius:0 0 3px 3px;background:var(--team-glow)}
.nav svg{width:22px;height:22px}

/* ============ TOAST / SKELETON / EMPTY ============ */
.toast{
  position:fixed;bottom:calc(var(--nav-h) + env(safe-area-inset-bottom) + 14px);left:50%;
  transform:translateX(-50%);z-index:120;background:var(--turf2);border:1px solid var(--line);
  color:var(--chalk);padding:11px 18px;border-radius:12px;font-size:13px;font-weight:600;
  box-shadow:0 8px 24px rgba(0,0,0,.5);animation:toastIn .25s both;white-space:nowrap;max-width:92vw;overflow:hidden;text-overflow:ellipsis;
}
@keyframes toastIn{from{opacity:0;transform:translateX(-50%) translateY(10px)}}
.skel{border-radius:var(--r);background:linear-gradient(100deg,var(--turf) 40%,var(--turf2) 50%,var(--turf) 60%);background-size:200% 100%;animation:shimmer 1.3s infinite;margin-bottom:10px}
@keyframes shimmer{to{background-position:-200% 0}}
.empty{text-align:center;padding:44px 24px;color:var(--chalk-dim)}
.empty .ic{font-size:36px;margin-bottom:10px}
.empty b{display:block;color:var(--chalk);font-family:var(--display);font-size:18px;letter-spacing:.03em;margin-bottom:4px}
.empty p{font-size:13px;line-height:1.5}
.refresh-btn{margin:4px auto 0;display:block;font-size:12px;color:var(--chalk-dim);padding:8px 14px;border:1px solid var(--line);border-radius:999px}
button:focus-visible,input:focus-visible{outline:2px solid var(--team-glow);outline-offset:2px}
</style>
</head>

<script>
(function(){
  function fail(msg){
    var r=document.getElementById('root');
    if(!r||r.firstChild) return;
    var d=document.createElement('div');
    d.style.cssText='padding:60px 24px;text-align:center;font-family:system-ui;color:#F2F4EF';
    d.innerHTML='<div style="font-size:34px;margin-bottom:12px">&#127944;</div><b style="font-size:18px">Sunday HQ couldn\'t start</b><p style="color:#9AA69E;font-size:13px;margin:8px auto 16px;max-width:300px"></p><button onclick="location.reload()" style="padding:10px 22px;border-radius:999px;border:1px solid #333;background:#121A15;color:#F2F4EF;font-weight:600">Reload</button>';
    d.querySelector('p').textContent=msg;
    r.appendChild(d);
  }
  window.addEventListener('error',function(e){fail('Script error: '+(e.message||'unknown')+'. Reload, or check your connection.')});
  setTimeout(function(){fail('The app libraries didn\'t load. Check your connection and reload.')},6000);
})();
</script>
